<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; style-src 'self' 'unsafe-inline'; connect-src 'none'; script-src 'self';" />
  <title>BB's LibMan</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <img src="../assets/icon.png" class="topbar-icon" alt="" />
    <h1>BB's LibMan</h1>
    <div class="search-wrap">
      <input type="search" id="search" placeholder="Search assets…" />
      <button class="btn-ghost btn-filter" id="btn-filter" title="Filter by tag">⌖ Tags</button>
      <div id="filter-dropdown" class="filter-dropdown" style="display:none;">
        <input type="search" id="filter-tag-search" placeholder="Search tags…" autocomplete="off" />
        <div id="filter-tag-list" class="filter-tag-list"></div>
      </div>
    </div>
    <div class="spacer"></div>
    <span id="asset-count" class="asset-count" title=""></span>
    <button class="btn-ghost" id="btn-sort" title="Sort order">⇅ Date</button>
    <button class="btn-ghost" id="btn-view" title="View mode">⊞ Grid</button>
    <button class="btn-ghost" id="btn-settings">⚙ Settings</button>
  </div>

  <div id="tag-filter-bar" style="display:none;">
    <span class="tag-filter-label">Filter:</span>
    <div id="tag-filter-chips"></div>
    <button class="btn-ghost tag-filter-clear" id="btn-clear-tag-filter" style="font-size:11px; padding:2px 8px;">✕ Clear</button>
  </div>

  <div id="library">
    <div class="empty-state" id="empty-state">
      <h2>No assets yet</h2>
      <p>Configure your root folder in Settings, then enable the downloads monitor to start importing assets.</p>
    </div>
    <div class="asset-grid" id="asset-grid"></div>
  </div>

  <div id="pagination-bar">
    <div class="pagination-info" id="pagination-info"></div>
    <div class="pagination-controls">
      <button class="btn-ghost pag-btn" id="btn-first" title="First page">«</button>
      <button class="btn-ghost pag-btn" id="btn-prev" title="Previous page">‹</button>
      <div class="pag-pages" id="pag-pages"></div>
      <button class="btn-ghost pag-btn" id="btn-next" title="Next page">›</button>
      <button class="btn-ghost pag-btn" id="btn-last" title="Last page">»</button>
    </div>
    <div class="pagination-size">
      <span>Per page:</span>
      <button class="btn-ghost pag-size-btn" data-size="10">10</button>
      <button class="btn-ghost pag-size-btn" data-size="30">30</button>
      <button class="btn-ghost pag-size-btn" data-size="50">50</button>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-progress-area">
      <div id="dl-progress" style="display:none;">
        <div class="dl-bar-track"><div id="dl-bar" class="dl-bar"></div></div>
        <span id="dl-pct" class="dl-pct">0%</span>
        <span id="dl-label" class="dl-label"></span>
      </div>
      <div id="queue-panel" style="display:none;">
        <div id="queue-active"></div>
      </div>
    </div>
    <div class="footer-credits">
      Made with ♥ for R.S. by BunBnnuy &nbsp;·&nbsp;
      <a href="https://github.com/BunBnnuy/BBLM" class="footer-link">view BBLM repo</a>
    </div>
  </footer>

  <div id="drop-overlay">
    <div class="drop-zone" id="drop-zone-new">
      <div class="drop-zone-icon">📦</div>
      <div class="drop-zone-label">Add New Asset</div>
      <div class="drop-zone-sub">Drop to open import dialog</div>
    </div>
    <div class="drop-zone" id="drop-zone-existing">
      <div class="drop-zone-icon">🗂</div>
      <div class="drop-zone-label">Add to Existing Asset</div>
      <div class="drop-zone-sub">Hold here to pick a card</div>
      <div class="drop-zone-timer" id="drop-zone-timer"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
