<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; style-src 'self' 'unsafe-inline'; connect-src 'none'; script-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';" />
  <title>Import Asset – BB's LibMan</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="modal-body">
    <div id="new-files-banner" class="new-files-banner" style="display:none;">
      <span>📥 New files were downloaded and added to the list.</span>
      <button class="new-files-banner-close" id="btn-dismiss-banner" title="Dismiss">×</button>
    </div>

    <div id="asset-suggestions" class="new-files-banner-suggestions" style="display:none;">
      <span class="suggestions-label">Add to existing collection:</span>
      <div class="suggestions-strip" id="suggestions-strip"></div>
    </div>
    <div class="modal-title" id="modal-title">Import Asset</div>

    <div class="field">
      <label>Origin URL</label>
      <div class="field-row">
        <input type="url" id="origin-url" placeholder="https://example.com/asset-page" />
        <button class="btn-secondary" id="btn-scrape">Fetch Data</button>
      </div>
    </div>

    <div class="field">
      <label>Asset Name</label>
      <input type="text" id="asset-name" placeholder="My Awesome Asset" />
    </div>

    <div class="field" id="file-field">
      <label>File to Import</label>
      <div class="field-row">
        <input type="text" id="file-name" placeholder="filename.zip" readonly />
        <button class="btn-secondary" id="btn-browse">Browse…</button>
      </div>
      <div id="file-list" class="file-list" style="display:none;"></div>
    </div>

    <div id="status" class="status"></div>

    <div class="field" id="tags-field">
      <label>Tags</label>
      <div class="tag-editor" id="tag-editor">
        <div class="tag-pills" id="tag-pills"></div>
        <input type="text" id="tag-input" placeholder="Add tag…" autocomplete="off" />
        <datalist id="tag-suggestions"></datalist>
      </div>
    </div>

    <div class="field">
      <label class="checkbox-field">
        <input type="checkbox" id="is-adult" />
        <span>🔞 Adult content (R-18)</span>
      </label>
    </div>

    <div class="field" id="image-section" style="display:none">
      <label>Select Thumbnail <span style="font-weight:400; color:var(--text-dim)">(optional — leave unselected to keep current)</span></label>
      <div class="image-grid" id="image-grid"></div>
      <div style="margin-top:6px; font-size:11px; color:var(--text-dim)">Click an image to select it as the thumbnail</div>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" id="btn-cancel">Cancel</button>
      <button class="btn-primary" id="btn-import">Import</button>
    </div>
  </div>

  <script src="modal.js"></script>
</body>
</html>
